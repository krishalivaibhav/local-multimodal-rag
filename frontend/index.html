<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas · Local Multimodal RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  :root {
    --bg:#F6F4EF; --surface:#FBFAF7; --surface-2:#FFFFFF; --surface-3:#F0EFE9;
    --border:#E7E3DA; --border-2:#E2DDD2; --border-3:#EBE7DE; --border-strong:#C9C2B4;
    --text:#26241F; --text-strong:#2A2823; --text-2:#4A463E; --text-3:#6B675E;
    --muted:#9A958A; --muted-2:#ADA89C; --faint:#BBB6AB;
    --accent:#2F5BEA; --ink:#1A1A18; --ink-text:#F4F2EC;
    --green:#2FA866; --amber:#E0892B; --hl:#FBE7A1; --hl-text:#2A2823;
    --track:#ECE8DF; --track-2:#EFEDE6; --hover:#F4F2EC; --disabled:#CFCABE;
    --tooltip-bg:#2A2823; --tooltip-text:#F4F2EC;
  }
  html.dark {
    --bg:#1A1916; --surface:#211F1B; --surface-2:#26231E; --surface-3:#2A2722;
    --border:#332F29; --border-2:#3A362E; --border-3:#34302A; --border-strong:#46413A;
    --text:#E9E4DA; --text-strong:#F4F0E7; --text-2:#CBC5B8; --text-3:#ABA597;
    --muted:#8C8678; --muted-2:#77715F; --faint:#615C50;
    --accent:#7C97FF; --ink:#E9E4DA; --ink-text:#1A1916;
    --green:#46C585; --amber:#E8A24F; --hl:#6E5C2C; --hl-text:#FCEBB0;
    --track:#322E28; --track-2:#2C2924; --hover:#2C2823; --disabled:#403B33;
    --tooltip-bg:#34302A; --tooltip-text:#F4F0E7;
  }
  body { font-family: 'IBM Plex Sans', sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; transition: background .25s; }
  textarea { font-family: inherit; }
  textarea::placeholder { color: var(--muted-2); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); background-clip: content-box; }
  @keyframes atlSpin { to { transform: rotate(360deg); } }
  @keyframes atlFadeUp { from { opacity:0; transform: translateY(9px); } to { opacity:1; transform: translateY(0); } }
  @keyframes atlPop { from { opacity: 0; transform: translate(-50%, calc(-100% - 4px)) scale(.94); } to { opacity: 1; transform: translate(-50%, calc(-100% - 9px)) scale(1); } }
  @keyframes atlPulseDot { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes atlBar { 0% { left: -35%; } 100% { left: 100%; } }
  .hov:hover { background: var(--hover) !important; }
  .hov-b:hover { border-color: var(--border-strong) !important; color: var(--text) !important; }
  .atl-cite-chip { cursor: pointer; font-family: 'IBM Plex Mono'; font-size: 10px; font-weight: 600; color: #FFFFFF; background: var(--muted); border-radius: 5px; padding: 1px 5px; margin: 0 1px; vertical-align: 1px; line-height: 1.6; }
  .atl-cite-chip:hover { background: var(--accent); }
  .open-btn:hover { border-color: var(--accent) !important; color: var(--accent) !important; }
</style>
</head>
<body>
<div style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">

  <!-- HEADER -->
  <header style="height: 60px; flex: 0 0 60px; display: flex; align-items: center; gap: 18px; padding: 0 22px; background: var(--surface); border-bottom: 1px solid var(--border); position: relative; z-index: 40;">
    <div style="display: flex; align-items: center; gap: 11px;">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: var(--ink); color: var(--ink-text); display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,.18);">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 3.2C2 2.5 2.5 2 3.2 2H7v12H3.2C2.5 14 2 13.5 2 12.8V3.2Z" stroke="currentColor" stroke-width="1.3"/><path d="M14 3.2C14 2.5 13.5 2 12.8 2H9v12h3.8c.7 0 1.2-.5 1.2-1.2V3.2Z" stroke="currentColor" stroke-width="1.3"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; line-height: 1;">
        <span style="font-size: 15px; font-weight: 600; letter-spacing: -.2px; color: var(--text-strong);">Atlas</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 1.2px; color: var(--muted); text-transform: uppercase; margin-top: 3px;">Local Multimodal RAG</span>
      </div>
    </div>
    <div style="width: 1px; height: 26px; background: var(--border);"></div>

    <!-- doc selector -->
    <div style="position: relative;">
      <button id="docBtn" class="hov-b" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px 0 11px; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 9px; cursor: pointer; min-width: 248px;">
        <span id="docTag" style="width: 22px; height: 22px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono'; font-size: 11px; font-weight: 600; color: #FFF; background: #6B675E;">∗</span>
        <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1; flex: 1;">
          <span id="docName" style="font-family: 'IBM Plex Mono'; font-size: 12.5px; font-weight: 500; color: var(--text-strong);">All documents</span>
          <span id="docMeta" style="font-size: 10.5px; color: var(--muted); margin-top: 3px;">—</span>
        </span>
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" style="color: var(--muted);"><path d="M4 6.5L8 10.5L12 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="docMenu" style="display:none; position: absolute; top: 46px; left: 0; width: 320px; max-height: 60vh; overflow-y:auto; background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 12px; box-shadow: 0 12px 34px rgba(40,36,28,.16); padding: 6px; z-index: 50;">
        <div style="font-family: 'IBM Plex Mono'; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: var(--muted-2); padding: 7px 9px 8px;">Retrieve from</div>
        <div id="docList"></div>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 13px; background: var(--surface-3); border: 1px solid var(--border); border-radius: 20px;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 3px rgba(47,168,102,.16);"></span>
      <span id="statusPill" style="font-family: 'IBM Plex Mono'; font-size: 11px; color: var(--text-3);">Indexed locally</span>
    </div>

    <button id="themeBtn" class="hov-b" title="Toggle theme" style="width: 36px; height: 36px; border: 1px solid var(--border-2); background: var(--surface-2); border-radius: 9px; cursor: pointer; color: var(--text-3); display: flex; align-items: center; justify-content: center;"></button>
  </header>

  <!-- BODY -->
  <div style="flex: 1; display: flex; min-height: 0;">
    <!-- chat column -->
    <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
      <div id="thread" style="flex: 1; overflow-y: auto; padding: 30px 0 18px;">
        <div id="threadInner" style="max-width: 720px; margin: 0 auto; padding: 0 30px; display: flex; flex-direction: column; gap: 26px;"></div>
      </div>

      <!-- composer -->
      <div style="flex: 0 0 auto; padding: 6px 30px 22px; background: linear-gradient(to top, var(--bg) 62%, transparent);">
        <div style="max-width: 720px; margin: 0 auto;">
          <div style="background: var(--surface-2); border: 1px solid var(--border-2); border-radius: 16px; box-shadow: 0 6px 22px rgba(40,36,28,.07); padding: 6px;">
            <div id="quoteChip" style="display:none; gap: 9px; align-items: flex-start; margin: 2px 2px 6px; padding: 9px 11px; background: var(--surface-3); border: 1px solid var(--border-2); border-left: 3px solid var(--accent); border-radius: 9px;">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="color: var(--accent); flex: 0 0 14px; margin-top: 2px;"><path d="M3 4h4v4H4.5a1.5 1.5 0 0 1-1.5-1.5V4ZM9 4h4v4h-2.5A1.5 1.5 0 0 1 9 6.5V4Z" stroke="currentColor" stroke-width="1.2"/></svg>
              <span id="quoteText" style="flex: 1; min-width: 0; font-family: 'IBM Plex Serif', serif; font-style: italic; font-size: 12.5px; line-height: 1.5; color: var(--text-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;"></span>
              <button id="quoteClear" class="hov" style="width: 20px; height: 20px; flex: 0 0 20px; border: none; background: transparent; border-radius: 5px; cursor: pointer; color: var(--muted); display: flex; align-items: center; justify-content: center;"><svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>
            </div>
            <div style="display: flex; align-items: flex-end; gap: 8px;">
              <textarea id="input" rows="1" placeholder="Ask anything about your documents…" style="flex: 1; resize: none; border: none; outline: none; background: transparent; font-size: 14.5px; line-height: 1.5; color: var(--text); padding: 9px 4px 9px 12px; max-height: 140px;"></textarea>
              <button id="sendBtn" style="width: 38px; height: 38px; flex: 0 0 38px; border: none; border-radius: 11px; cursor: pointer; background: var(--disabled); color: #FFF; display: flex; align-items: center; justify-content: center; transition: background .15s;"><svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M8.5 14V3.5M8.5 3.5L4 8M8.5 3.5L13 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            </div>
          </div>
          <div style="display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 11px;">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" style="color: var(--faint);"><path d="M7 1.5l5 2.5v3.5c0 3-2.2 5.3-5 6-2.8-.7-5-3-5-6V4L7 1.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
            <span style="font-family: 'IBM Plex Mono'; font-size: 10.5px; color: var(--muted-2);">Select any sentence in an answer to ask a follow-up · runs fully on-device</span>
          </div>
        </div>
      </div>
    </div>

    <!-- citation panel -->
    <div id="panelWrap" style="flex: 0 0 auto; height: 100%; overflow: hidden; transition: width .34s cubic-bezier(.4,0,.2,1); width: 416px;">
      <div style="width: 416px; height: 100%; display: flex; flex-direction: column; background: var(--surface); border-left: 1px solid var(--border);">
        <div id="panelHead" style="flex: 0 0 auto; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 20px; border-bottom: 1px solid var(--border);"></div>
        <div id="panel" style="flex: 1; overflow-y: auto;"></div>
      </div>
    </div>
  </div>
</div>

<!-- selection popover -->
<div id="popover" style="display:none; position: fixed; z-index: 80; background: var(--tooltip-bg); border: 1px solid var(--border-2); border-radius: 10px; padding: 8px 13px; box-shadow: 0 10px 28px rgba(0,0,0,.26); align-items: center; white-space: nowrap; transform: translate(-50%, calc(-100% - 9px)); animation: atlPop .14s ease both;">
  <button id="askAbout" style="display: flex; align-items: center; gap: 7px; background: transparent; border: none; color: var(--tooltip-text); cursor: pointer; font-size: 12.5px; font-weight: 500; padding: 0;"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M2.5 3.5h11v7h-6L4 13.5V10.5H2.5v-7Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M5.5 6.5h5M5.5 8.5h3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Ask about this</button>
</div>

<script>
const API = '';
const DOC_COLORS = ['#D4483B', '#E0892B', '#2E9E8F', '#2F5BEA', '#7A5BD4', '#C7384F'];
const state = { docs: [], selected: 'all', panelOpen: true, busy: false, activeCites: [], quote: '', viewer: null };
const el = id => document.getElementById(id);
const esc = s => (s || '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));

// ---- theme -------------------------------------------------------------------
const SUN = `<svg width="17" height="17" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="3.6" stroke="currentColor" stroke-width="1.4"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.8 3.8l1.4 1.4M12.8 12.8l1.4 1.4M3.8 14.2l1.4-1.4M12.8 5.2l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`;
const MOON = `<svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M15 11.2A6.6 6.6 0 0 1 6.8 3a6.6 6.6 0 1 0 8.2 8.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
function applyTheme(t) {
  document.documentElement.classList.toggle('dark', t === 'dark');
  el('themeBtn').innerHTML = t === 'dark' ? SUN : MOON;
}
function toggleTheme() {
  const t = document.documentElement.classList.contains('dark') ? 'light' : 'dark';
  try { localStorage.setItem('atlas-rag-theme', t); } catch (e) {}
  applyTheme(t);
}
el('themeBtn').onclick = toggleTheme;
(function () { let t = 'light'; try { const s = localStorage.getItem('atlas-rag-theme'); if (s) t = s; } catch (e) {} applyTheme(t); })();

// ---- document selector -------------------------------------------------------
async function loadDocs() {
  try {
    const d = await (await fetch(API + '/api/docs')).json();
    state.docs = d.documents;
    el('statusPill').textContent = 'Indexed locally · ' + (state.docs.length - 1) + ' sources';
    renderDocMenu(); selectDoc('all');
  } catch (e) { el('statusPill').textContent = 'Backend offline'; }
}
function docColor(doc) { if (!doc || doc.id === 'all') return '#6B675E'; let h = 0; for (const c of doc.id) h = (h * 31 + c.charCodeAt(0)) >>> 0; return DOC_COLORS[h % DOC_COLORS.length]; }
function docTag(doc) { return (!doc || doc.id === 'all') ? '∗' : (doc.name[0] || 'P').toUpperCase(); }
function renderDocMenu() {
  el('docList').innerHTML = '';
  for (const doc of state.docs) {
    const b = document.createElement('button'); b.className = 'hov';
    b.style.cssText = 'width:100%;display:flex;align-items:center;gap:11px;padding:9px;background:transparent;border:none;border-radius:8px;cursor:pointer;text-align:left;';
    b.innerHTML = `<span style="width:24px;height:24px;flex:0 0 24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:11px;font-weight:600;color:#FFF;background:${docColor(doc)};">${docTag(doc)}</span><span style="flex:1;display:flex;flex-direction:column;line-height:1;min-width:0;"><span style="font-family:'IBM Plex Mono';font-size:12.5px;color:var(--text-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(doc.name)}</span><span style="font-size:10.5px;color:var(--muted);margin-top:3px;">${esc(doc.meta || '')}</span></span>${doc.id === state.selected ? `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" style="color:var(--accent);"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>` : ''}`;
    b.onclick = () => { selectDoc(doc.id); toggleMenu(false); };
    el('docList').appendChild(b);
  }
}
function selectDoc(id) {
  state.selected = id;
  const doc = state.docs.find(d => d.id === id) || { id: 'all', name: 'All documents', meta: '' };
  el('docTag').textContent = docTag(doc); el('docTag').style.background = docColor(doc);
  el('docName').textContent = doc.name; el('docMeta').textContent = doc.meta || '';
  renderDocMenu();
}
function toggleMenu(force) { const open = force !== undefined ? force : el('docMenu').style.display === 'none'; el('docMenu').style.display = open ? 'block' : 'none'; }
el('docBtn').onclick = e => { e.stopPropagation(); toggleMenu(); };
document.addEventListener('click', () => toggleMenu(false));

// ---- thread (append-only; streaming updates a text node, no full re-render) ----
function avatar() { return `<span style="width:24px;height:24px;border-radius:7px;background:var(--ink);color:var(--ink-text);display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 3.2C2 2.5 2.5 2 3.2 2H7v12H3.2C2.5 14 2 13.5 2 12.8V3.2Z" stroke="currentColor" stroke-width="1.3"/><path d="M14 3.2C14 2.5 13.5 2 12.8 2H9v12h3.8c.7 0 1.2-.5 1.2-1.2V3.2Z" stroke="currentColor" stroke-width="1.3"/></svg></span>`; }
function scrollThread() { const t = el('thread'); t.scrollTop = t.scrollHeight; }
function appendUser(text, quote) {
  const d = document.createElement('div');
  d.style.cssText = 'display:flex;justify-content:flex-end;animation:atlFadeUp .35s ease;';
  const q = quote ? `<div style="border-left:2px solid currentColor;padding-left:10px;margin-bottom:8px;font-family:'IBM Plex Serif',serif;font-style:italic;font-size:12.5px;line-height:1.5;opacity:.72;">${esc(quote)}</div>` : '';
  d.innerHTML = `<div style="max-width:80%;background:var(--ink);color:var(--ink-text);padding:11px 15px;border-radius:14px 14px 4px 14px;font-size:14.5px;line-height:1.5;">${q}<span>${esc(text)}</span></div>`;
  el('threadInner').appendChild(d); scrollThread();
}
let _loaderEl = null;
function showLoader() {
  const stages = ['Searching across documents', 'Retrieving relevant pages', 'Synthesizing grounded answer'];
  const d = document.createElement('div'); d.style.cssText = 'animation:atlFadeUp .35s ease;';
  d.innerHTML = `<div style="display:flex;align-items:center;gap:9px;margin-bottom:13px;">${avatar().replace('width:24px;height:24px', 'width:24px;height:24px')}<span style="font-family:'IBM Plex Mono';font-size:11px;color:var(--muted);">Atlas is retrieving…</span></div><div id="loaderBox" style="margin-left:33px;background:var(--surface-2);border:1px solid var(--border);border-radius:13px;padding:16px 18px;max-width:380px;box-shadow:0 4px 16px rgba(40,36,28,.05);"></div>`;
  el('threadInner').appendChild(d); _loaderEl = d; state.stage = 0; renderLoader(stages); scrollThread();
  d._stages = stages;
}
function renderLoader(stages) {
  if (!_loaderEl) return;
  const cur = state.stage || 0;
  const rows = stages.map((label, i) => {
    const done = i < cur, active = i === cur;
    const ic = done ? `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" fill="#2FA866"/><path d="M5.5 9.2L8 11.5L12.5 6.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : active ? `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="animation:atlSpin 1s linear infinite;"><circle cx="8" cy="8" r="6.4" stroke="var(--track)" stroke-width="1.6"/><path d="M8 1.6A6.4 6.4 0 0 1 14.4 8" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/></svg>`
      : `<span style="width:9px;height:9px;border-radius:50%;border:1.6px solid var(--border-strong);display:inline-block;"></span>`;
    return `<div style="display:flex;align-items:center;gap:11px;padding:5px 0;"><span style="width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;">${ic}</span><span style="font-size:13px;font-weight:500;color:${i <= cur ? 'var(--text)' : 'var(--muted-2)'};">${label}</span></div>`;
  }).join('');
  el('loaderBox').innerHTML = rows + `<div style="position:relative;height:3px;border-radius:3px;background:var(--track-2);overflow:hidden;margin-top:12px;"><span style="position:absolute;top:0;width:35%;height:100%;border-radius:3px;background:var(--accent);animation:atlBar 1.15s ease-in-out infinite;"></span></div>`;
}
function removeLoader() { if (_loaderEl) { _loaderEl.remove(); _loaderEl = null; } }

let _streamMsg = null;   // { wrap, answerEl }
function appendAssistantShell() {
  const d = document.createElement('div'); d.style.cssText = 'animation:atlFadeUp .4s ease;';
  d.innerHTML = `<div style="display:flex;align-items:center;gap:9px;margin-bottom:11px;">${avatar()}<span style="font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.3px;color:var(--muted);">Atlas</span></div><div data-answer="1" style="font-family:'IBM Plex Serif',serif;font-size:16px;line-height:1.72;color:var(--text);padding-left:33px;white-space:pre-wrap;"></div><div class="asst-actions" style="padding-left:33px;"></div>`;
  el('threadInner').appendChild(d);
  _streamMsg = { wrap: d, answerEl: d.querySelector('[data-answer]'), actions: d.querySelector('.asst-actions') };
  scrollThread();
}
function finalizeAssistant(payload) {
  if (!_streamMsg) return;
  const m = { id: 'm' + Date.now(), text: payload.answer || '', citations: payload.citations || [], tag_to_n: payload.tag_to_n || {} };
  // render the answer with inline numbered citation chips
  let html = esc(m.text).replace(/\[(S\d+)\]/g, (full, tag) => { const n = m.tag_to_n[tag]; return n ? `<sup class="atl-cite-chip" data-n="${n}">${n}</sup>` : ''; });
  _streamMsg.answerEl.innerHTML = html;
  _streamMsg.answerEl.querySelectorAll('.atl-cite-chip').forEach(c => c.onclick = () => { state.activeCites = m.citations; state.viewer = null; openCite(+c.dataset.n); });
  const cnt = m.citations.length;
  if (cnt) {
    _streamMsg.actions.style.cssText = 'display:flex;align-items:center;gap:14px;margin-top:16px;padding-left:33px;';
    _streamMsg.actions.innerHTML = `<button class="src-btn" style="display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;background:var(--accent);color:#FFF;border:1px solid var(--accent);"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="2" width="11" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5 5.5h6M5 8h6M5 10.5h3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>Showing ${cnt} source${cnt > 1 ? 's' : ''}</button>`;
    _streamMsg.actions.querySelector('.src-btn').onclick = () => { state.activeCites = m.citations; state.viewer = null; state.panelOpen = true; renderPanel(); el('panel').scrollTo({ top: 0, behavior: 'smooth' }); };
  }
  _streamMsg = null;
}

// ---- citation panel: list view + in-panel page viewer ------------------------
function panelHeadList(n) {
  el('panelHead').innerHTML = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="color:var(--accent);"><path d="M3 2.5h7l3 3V13a.5.5 0 0 1-.5.5h-9A.5.5 0 0 1 3 13V2.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9.5 2.5V6h3.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg><span style="font-size:14px;font-weight:600;letter-spacing:-.1px;color:var(--text-strong);">Cited sources</span><span style="font-family:'IBM Plex Mono';font-size:11px;color:#FFF;background:var(--accent);border-radius:11px;padding:2px 8px;">${n}</span><div style="flex:1;"></div><button id="panelClose" class="hov" style="width:30px;height:30px;border:none;background:transparent;border-radius:8px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;"><svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></button>`;
  el('panelClose').onclick = () => { state.panelOpen = false; el('panelWrap').style.width = '0px'; };
}
function renderPanel() {
  el('panelWrap').style.width = state.panelOpen ? '416px' : '0px';
  if (state.viewer) return renderViewer(state.viewer);
  const cites = state.activeCites || [];
  panelHeadList(cites.length);
  el('panel').style.padding = '16px 16px 22px';
  el('panel').innerHTML = `<div style="font-family:'IBM Plex Mono';font-size:10px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted-2);padding:2px 4px 12px;">Passages grounding this answer</div><div id="citeList" style="display:flex;flex-direction:column;gap:13px;"></div>`;
  const list = el('citeList');
  cites.forEach(c => {
    const active = c.n === state.activeRef;
    const card = document.createElement('div'); card.id = 'cite-' + c.n;
    card.style.cssText = `scroll-margin-top:60px;background:var(--surface-2);border-radius:11px;padding:13px;transition:border-color .2s,box-shadow .2s;border:1px solid ${active ? 'var(--accent)' : 'var(--border-3)'};box-shadow:${active ? '0 0 0 3px rgba(99,128,255,.18)' : '0 1px 2px rgba(40,36,28,.04)'};`;
    const tag = (c.doc || 'P')[0].toUpperCase(), color = docColor({ id: c.doc || '' });
    const kindLabel = c.kind === 'figure' ? 'FIGURE' : c.kind === 'table' ? 'TABLE' : 'PDF PAGE';
    card.innerHTML =
      `<div style="display:flex;align-items:center;gap:9px;margin-bottom:11px;"><span style="width:21px;height:21px;flex:0 0 21px;border-radius:6px;background:var(--accent);color:#FFF;font-family:'IBM Plex Mono';font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;">${c.n}</span><span style="width:19px;height:19px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:9.5px;font-weight:600;color:#FFF;background:${color};">${tag}</span><span style="flex:1;min-width:0;font-family:'IBM Plex Mono';font-size:11.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.doc || '')}</span><span style="font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);flex:0 0 auto;">${esc(c.loc || '')}</span></div>`
    + `<div class="cthumb" style="position:relative;border-radius:8px;overflow:hidden;border:1px solid var(--border-3);margin-bottom:11px;cursor:zoom-in;">${c.image_url ? `<img src="${API + c.image_url}" loading="lazy" style="width:100%;height:150px;object-fit:cover;object-position:top;display:block;background:#FFF;">` : `<div style="height:118px;background:var(--surface-3);"></div>`}<span style="position:absolute;top:7px;right:8px;font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.5px;color:#FFF;background:rgba(26,26,24,.6);border-radius:4px;padding:2px 6px;">${kindLabel}</span></div>`
    + `<p style="margin:0 0 11px;font-size:12.5px;line-height:1.62;color:var(--text-2);">${esc(c.snippet || '')}</p>`
    + `<div style="display:flex;align-items:center;justify-content:flex-end;"><button class="open-btn" style="display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 9px;border-radius:7px;border:1px solid var(--border-2);background:var(--surface-2);cursor:pointer;font-size:11px;color:var(--text-2);">Open<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M3 9L9 3M9 3H4.5M9 3v4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></button></div>`;
    const open = () => { state.viewer = c; renderPanel(); };
    card.querySelector('.cthumb').onclick = open;
    card.querySelector('.open-btn').onclick = open;
    list.appendChild(card);
  });
}
function openCite(n) { state.activeRef = n; state.viewer = null; state.panelOpen = true; renderPanel(); const card = el('cite-' + n); if (card) el('panel').scrollTo({ top: Math.max(0, card.offsetTop - 60), behavior: 'smooth' }); }

// in-panel page viewer with zoom + pan + back
function renderViewer(c) {
  el('panelHead').innerHTML = `<button id="vBack" class="hov" style="display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 7px;border:1px solid var(--border-2);background:var(--surface-2);border-radius:8px;cursor:pointer;color:var(--text-2);font-size:12px;"><svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8l5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>Back</button><span style="flex:1;min-width:0;margin-left:4px;font-family:'IBM Plex Mono';font-size:11.5px;color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.doc || '')} · ${esc(c.loc || '')}</span><div style="display:flex;align-items:center;gap:4px;"><button id="vOut" class="hov-b" style="width:28px;height:28px;border:1px solid var(--border-2);background:var(--surface-2);border-radius:7px;cursor:pointer;color:var(--text-2);font-size:15px;">−</button><span id="vPct" style="font-family:'IBM Plex Mono';font-size:10.5px;color:var(--muted);width:34px;text-align:center;">100%</span><button id="vIn" class="hov-b" style="width:28px;height:28px;border:1px solid var(--border-2);background:var(--surface-2);border-radius:7px;cursor:pointer;color:var(--text-2);font-size:15px;">+</button></div>`;
  el('panel').style.padding = '0';
  el('panel').innerHTML = `<div id="vStage" style="width:100%;height:100%;overflow:hidden;background:var(--surface-3);display:flex;align-items:flex-start;justify-content:center;cursor:grab;"><img id="vImg" src="${API + (c.image_url || '')}" style="max-width:100%;transform-origin:top center;user-select:none;-webkit-user-drag:none;display:block;"></div>`;
  const stage = el('vStage'), img = el('vImg');
  let z = 1, x = 0, y = 0, drag = null;
  const apply = () => { img.style.transform = `translate(${x}px,${y}px) scale(${z})`; el('vPct').textContent = Math.round(z * 100) + '%'; stage.style.cursor = z > 1 ? (drag ? 'grabbing' : 'grab') : 'default'; };
  const setZoom = nz => { z = Math.max(1, Math.min(5, nz)); if (z === 1) { x = 0; y = 0; } apply(); };
  el('vBack').onclick = () => { state.viewer = null; renderPanel(); };
  el('vIn').onclick = () => setZoom(z + 0.4);
  el('vOut').onclick = () => setZoom(z - 0.4);
  stage.addEventListener('wheel', e => { e.preventDefault(); setZoom(z + (e.deltaY < 0 ? 0.25 : -0.25)); }, { passive: false });
  stage.addEventListener('mousedown', e => { if (z <= 1) return; drag = { px: e.clientX, py: e.clientY, ox: x, oy: y }; apply(); });
  window.addEventListener('mousemove', e => { if (!drag) return; x = drag.ox + (e.clientX - drag.px); y = drag.oy + (e.clientY - drag.py); apply(); });
  window.addEventListener('mouseup', () => { if (drag) { drag = null; apply(); } });
  apply();
}

// ---- select-a-sentence -> "Ask about this" -----------------------------------
function hidePopover() { el('popover').style.display = 'none'; }
document.addEventListener('mouseup', () => setTimeout(() => {
  const sel = window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return hidePopover();
  const text = sel.toString().replace(/\s+/g, ' ').trim();
  if (text.length < 2) return hidePopover();
  let node = sel.anchorNode; let n = node && node.nodeType === 3 ? node.parentElement : node;
  if (!n || !n.closest || !n.closest('[data-answer]')) return hidePopover();
  const r = sel.getRangeAt(0).getBoundingClientRect();
  if (!r || (!r.width && !r.height)) return hidePopover();
  const p = el('popover'); p._text = text;
  p.style.left = (r.left + r.width / 2) + 'px'; p.style.top = r.top + 'px'; p.style.display = 'flex';
}, 0));
el('thread').addEventListener('scroll', hidePopover);
el('askAbout').onmousedown = e => {
  e.preventDefault(); const text = el('popover')._text; if (!text) return;
  state.quote = text; el('quoteText').textContent = text; el('quoteChip').style.display = 'flex';
  hidePopover(); try { window.getSelection().removeAllRanges(); } catch (_) {}
  el('input').focus();
};
el('quoteClear').onclick = () => { state.quote = ''; el('quoteChip').style.display = 'none'; };

// ---- send + SSE --------------------------------------------------------------
function setSend(on) { el('sendBtn').style.background = on ? 'var(--accent)' : 'var(--disabled)'; }
function autoGrow() { const t = el('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
el('input').addEventListener('input', () => { setSend(el('input').value.trim() && !state.busy); autoGrow(); });
el('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
el('sendBtn').onclick = send;

async function send() {
  const q = el('input').value.trim();
  if (!q || state.busy) return;
  const quote = state.quote;
  const sendText = quote ? `Regarding this passage: "${quote}"\n\n${q}` : q;
  appendUser(q, quote);
  el('input').value = ''; autoGrow(); setSend(false);
  state.quote = ''; el('quoteChip').style.display = 'none';
  state.busy = true; showLoader();
  let started = false;
  try {
    const res = await fetch(API + '/api/ask', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ question: sendText, doc: state.selected }) });
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        let evt = 'message', data = '';
        for (const line of frame.split('\n')) { if (line.startsWith('event:')) evt = line.slice(6).trim(); else if (line.startsWith('data:')) data += line.slice(5).replace(/^ /, ''); }
        if (!data) continue;
        const p = JSON.parse(data);
        if (evt === 'stage') { state.stage = p.stage === 'retrieving' ? 1 : 2; if (_loaderEl) renderLoader(_loaderEl._stages); }
        else if (evt === 'token') { if (!started) { started = true; removeLoader(); appendAssistantShell(); } _streamMsg.answerEl.textContent += p.text; scrollThread(); }
        else if (evt === 'done') {
          if (!started) { removeLoader(); appendAssistantShell(); }
          finalizeAssistant(p);
          state.activeCites = p.citations || []; state.viewer = null; state.activeRef = null;
          if ((p.citations || []).length) { state.panelOpen = true; renderPanel(); }
          else renderPanel();
        }
      }
    }
  } catch (e) {
    removeLoader();
    if (!started) { appendAssistantShell(); _streamMsg.answerEl.textContent = '⚠ Could not reach the backend. Is api.py running on :8000?'; _streamMsg = null; }
  }
  state.busy = false; setSend(el('input').value.trim());
}

loadDocs();
renderPanel();
</script>
