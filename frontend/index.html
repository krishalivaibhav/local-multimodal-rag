<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas · Local Multimodal RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  /* Light "paper" palette (the Atlas design tokens). */
  :root {
    --bg:#F6F4EF; --surface:#FBFAF7; --surface-2:#FFFFFF; --surface-3:#F0EFE9;
    --border:#E7E3DA; --border-2:#E2DDD2; --border-3:#EBE7DE; --border-strong:#C9C2B4;
    --text:#26241F; --text-strong:#2A2823; --text-2:#4A463E; --text-3:#6B675E;
    --muted:#9A958A; --muted-2:#ADA89C; --faint:#BBB6AB;
    --accent:#2F5BEA; --ink:#1A1A18; --ink-text:#F4F2EC;
    --green:#2FA866; --amber:#E0892B; --hl:#FBE7A1; --hl-text:#2A2823;
    --track:#ECE8DF; --track-2:#EFEDE6; --hover:#F4F2EC; --disabled:#CFCABE;
    --tooltip-bg:#2A2823; --tooltip-text:#F4F2EC;
  }
  html.dark {
    --bg:#1A1916; --surface:#211F1B; --surface-2:#26231E; --surface-3:#2A2722;
    --border:#332F29; --border-2:#3A362E; --border-3:#34302A; --border-strong:#46413A;
    --text:#E9E4DA; --text-strong:#F4F0E7; --text-2:#CBC5B8; --text-3:#ABA597;
    --muted:#8C8678; --muted-2:#77715F; --faint:#615C50;
    --accent:#7C97FF; --ink:#E9E4DA; --ink-text:#1A1916;
    --green:#46C585; --amber:#E8A24F; --hl:#6E5C2C; --hl-text:#FCEBB0;
    --track:#322E28; --track-2:#2C2924; --hover:#2C2823; --disabled:#403B33;
    --tooltip-bg:#34302A; --tooltip-text:#F4F0E7;
  }
  body { font-family: 'IBM Plex Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); -webkit-font-smoothing: antialiased; transition: background .25s, color .25s; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .serif { font-family: 'IBM Plex Serif', Georgia, serif; }
  textarea { font-family: inherit; }
  textarea::placeholder { color: var(--muted-2); }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--border-strong); background-clip: content-box; }
  @keyframes atlSpin { to { transform: rotate(360deg); } }
  @keyframes atlFadeUp { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes atlPop { from { opacity: 0; transform: translate(-50%, calc(-100% - 4px)) scale(.94); } to { opacity: 1; transform: translate(-50%, calc(-100% - 9px)) scale(1); } }
  @keyframes atlPulseDot { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes atlBar { 0% { left: -35%; } 100% { left: 100%; } }
  .hov-border:hover { border-color: var(--border-strong) !important; }
  .hov-accent:hover { border-color: var(--accent) !important; color: var(--accent) !important; }
  .hov-soft:hover { background: var(--hover) !important; color: var(--text-3) !important; }
  .thumb:hover { border-color: var(--accent) !important; }
  .thumb:hover .thumb-ov { opacity: 1 !important; }
  .cite-chip:hover { background: var(--accent) !important; }
  .md-code { font-family: 'IBM Plex Mono', ui-monospace, monospace; font-size: .92em; background: var(--surface-3); border: 1px solid var(--border-2); border-radius: 4px; padding: 0 4px; }
  [data-answer] p:last-child { margin-bottom: 0 !important; }
  [data-answer] strong { font-weight: 600; }
  [data-answer] .math sub, [data-answer] .math sup { font-size: .72em; }
  .msg-copy { opacity: 0; transition: opacity .15s; }
  .msg:hover .msg-copy { opacity: 1; }
</style>
</head>
<body>
<div id="app" style="height:100vh;display:flex;flex-direction:column;overflow:hidden;"></div>

<script>
"use strict";
const API = "";                       // same-origin
const PALETTE = ['#D4483B','#E0892B','#2E9E8F','#6E8BD6','#B5683C','#7E9E3C','#C0557A','#4E9CC4'];
const ICON = {
  book:  '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 3.2C2 2.5 2.5 2 3.2 2H7v12H3.2C2.5 14 2 13.5 2 12.8V3.2Z" stroke="currentColor" stroke-width="1.3"/><path d="M14 3.2C14 2.5 13.5 2 12.8 2H9v12h3.8c.7 0 1.2-.5 1.2-1.2V3.2Z" stroke="currentColor" stroke-width="1.3"/></svg>',
  chevron:'<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M4 6.5L8 10.5L12 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  search: '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.4" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  check:  '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  sun:    '<svg width="17" height="17" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="3.6" stroke="currentColor" stroke-width="1.4"/><path d="M9 1.5v2M9 14.5v2M1.5 9h2M14.5 9h2M3.8 3.8l1.4 1.4M12.8 12.8l1.4 1.4M3.8 14.2l1.4-1.4M12.8 5.2l1.4-1.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>',
  moon:   '<svg width="16" height="16" viewBox="0 0 18 18" fill="none"><path d="M15 11.2A6.6 6.6 0 0 1 6.8 3a6.6 6.6 0 1 0 8.2 8.2Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>',
  close:  '<svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
  back:   '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M10 3.5L5.5 8L10 12.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  doc:    '<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 2.5h7l3 3V13a.5.5 0 0 1-.5.5h-9A.5.5 0 0 1 3 13V2.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9.5 2.5V6h3.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>',
  list:   '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="2" width="11" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5 5.5h6M5 8h6M5 10.5h3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
  send:   '<svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M8.5 14V3.5M8.5 3.5L4 8M8.5 3.5L13 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  eye:    '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M8 3.5C4.5 3.5 2 8 2 8s2.5 4.5 6 4.5S14 8 14 8 11.5 3.5 8 3.5Z" stroke="currentColor" stroke-width="1.3"/><circle cx="8" cy="8" r="1.9" stroke="currentColor" stroke-width="1.3"/></svg>',
  arrowUp:'<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M3 9L9 3M9 3H4.5M9 3v4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  copy:   '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="5.5" y="5.5" width="8" height="8.5" rx="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M3 10.5V3.6A1.6 1.6 0 0 1 4.6 2H10.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>',
  tick:   '<svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M3.5 8.5L6.5 11.5L12.5 5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  quote:  '<svg width="14" height="14" viewBox="0 0 16 16" fill="none"><path d="M3 4h4v4H4.5a1.5 1.5 0 0 1-1.5-1.5V4ZM9 4h4v4h-2.5A1.5 1.5 0 0 1 9 6.5V4Z" stroke="currentColor" stroke-width="1.2"/><path d="M3 8c0 2.5 1 3.5 3 4M9 8c0 2.5 1 3.5 3 4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>',
  shield: '<svg width="12" height="12" viewBox="0 0 16 16" fill="none"><path d="M7 1.5l5 2.5v3.5c0 3-2.2 5.3-5 6-2.8-.7-5-3-5-6V4L7 1.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>',
  spinSm: '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="animation:atlSpin 1s linear infinite"><circle cx="8" cy="8" r="6.4" stroke="var(--track)" stroke-width="1.6"/><path d="M8 1.6A6.4 6.4 0 0 1 14.4 8" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round"/></svg>',
  checkOk:'<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" fill="#2FA866"/><path d="M5.5 9.2L8 11.5L12.5 6.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
};
const STAGES = ['Searching across documents', 'Retrieving relevant pages', 'Synthesizing grounded answer'];

const state = {
  theme: (localStorage.getItem('atlas-rag-theme') || 'light'),
  docs: [], pageCounts: {}, docId: 'all',
  menuOpen: false, docQuery: '',
  quote: '', busy: false,
  msgs: {},                 // msgId -> {citations, tag_to_n}
  activeMsgId: null, activeCite: null,
  panelOpen: false, viewer: null,
  zoom: 1, tx: 0, ty: 0,
  sel: { visible: false, x: 0, y: 0, text: '' },
};
let _id = 0;
const $ = (s, r=document) => r.querySelector(s);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const colorFor = (name) => { let h = 0; for (const c of String(name)) h = (h * 31 + c.charCodeAt(0)) >>> 0; return PALETTE[h % PALETTE.length]; };
const tagFor = (kind) => kind === 'all' ? '∗' : kind === 'figure' ? 'F' : kind === 'table' ? 'T' : 'P';
const scoreColor = (m) => m >= 0.9 ? 'var(--green)' : m >= 0.8 ? 'var(--accent)' : 'var(--amber)';

// ---------- shell ----------
function buildShell() {
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  $('#app').innerHTML = `
  <header style="height:60px;flex:0 0 60px;display:flex;align-items:center;gap:18px;padding:0 22px;background:var(--surface);border-bottom:1px solid var(--border);position:relative;z-index:40;transition:background .25s,border-color .25s;">
    <div style="display:flex;align-items:center;gap:11px;">
      <div style="width:30px;height:30px;border-radius:8px;background:var(--ink);color:var(--ink-text);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.18);">${ICON.book}</div>
      <div style="display:flex;flex-direction:column;line-height:1;">
        <span style="font-size:15px;font-weight:600;letter-spacing:-.2px;color:var(--text-strong);">Atlas</span>
        <span class="mono" style="font-size:9.5px;letter-spacing:1.2px;color:var(--muted);text-transform:uppercase;margin-top:3px;">Local Multimodal RAG</span>
      </div>
    </div>
    <div style="width:1px;height:26px;background:var(--border);"></div>
    <div style="position:relative;">
      <button id="docBtn" class="hov-border" style="display:flex;align-items:center;gap:10px;height:38px;padding:0 12px 0 11px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:9px;cursor:pointer;min-width:248px;transition:border-color .15s;"></button>
      <div id="docMenu"></div>
    </div>
    <div style="flex:1;"></div>
    <div style="display:flex;align-items:center;gap:8px;height:32px;padding:0 13px;background:var(--surface-3);border:1px solid var(--border);border-radius:20px;">
      <span style="width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px rgba(47,168,102,.16);"></span>
      <span id="statusText" class="mono" style="font-size:11px;color:var(--text-3);">Indexed locally</span>
    </div>
    <button id="themeBtn" class="hov-border" style="width:36px;height:36px;border:1px solid var(--border-2);background:var(--surface-2);border-radius:9px;cursor:pointer;color:var(--text-3);display:flex;align-items:center;justify-content:center;transition:border-color .15s,color .15s;">${state.theme === 'dark' ? ICON.sun : ICON.moon}</button>
  </header>

  <div style="flex:1;display:flex;min-height:0;">
    <div style="flex:1;display:flex;flex-direction:column;min-width:0;">
      <div id="thread" style="flex:1;overflow-y:auto;padding:30px 0 18px;">
        <div id="threadInner" style="max-width:720px;margin:0 auto;padding:0 30px;display:flex;flex-direction:column;gap:26px;"></div>
      </div>
      <div style="flex:0 0 auto;padding:6px 30px 22px;background:linear-gradient(to top,var(--bg) 62%,transparent);">
        <div style="max-width:720px;margin:0 auto;">
          <div style="background:var(--surface-2);border:1px solid var(--border-2);border-radius:16px;box-shadow:0 6px 22px rgba(40,36,28,.07);padding:6px;">
            <div id="quoteChip"></div>
            <div style="display:flex;align-items:flex-end;gap:8px;">
              <textarea id="composer" rows="1" placeholder="Ask anything about your documents…" style="flex:1;resize:none;border:none;outline:none;background:transparent;font-size:14.5px;line-height:1.5;color:var(--text);padding:9px 8px;max-height:140px;overflow:hidden;"></textarea>
              <button id="sendBtn" style="width:38px;height:38px;flex:0 0 38px;border:none;border-radius:11px;cursor:pointer;background:var(--disabled);color:#fff;display:flex;align-items:center;justify-content:center;transition:background .15s;">${ICON.send}</button>
            </div>
          </div>
          <div style="display:flex;align-items:center;justify-content:center;gap:7px;margin-top:11px;color:var(--faint);">
            ${ICON.shield}
            <span class="mono" style="font-size:10.5px;color:var(--muted-2);">Select any sentence in an answer to ask a follow-up · runs fully on-device</span>
          </div>
        </div>
      </div>
    </div>

    <div id="panelWrap" style="flex:0 0 auto;height:100%;overflow:hidden;transition:width .34s cubic-bezier(.4,0,.2,1);width:0;">
      <div style="width:416px;height:100%;display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);">
        <div id="panelHead" style="flex:0 0 auto;height:60px;display:flex;align-items:center;gap:10px;padding:0 16px 0 20px;border-bottom:1px solid var(--border);"></div>
        <div id="panel" style="flex:1;overflow-y:auto;padding:16px 16px 22px;"></div>
      </div>
    </div>
  </div>

  <div id="popover"></div>`;

  $('#themeBtn').onclick = toggleTheme;
  $('#docBtn').onclick = (e) => { e.stopPropagation(); state.menuOpen = !state.menuOpen; state.docQuery=''; renderDocMenu(); if (state.menuOpen) setTimeout(() => $('#docSearch') && $('#docSearch').focus(), 30); };
  const ta = $('#composer');
  ta.oninput = () => { ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight,140)+'px'; ta.style.overflowY = ta.scrollHeight>140 ? 'auto':'hidden'; refreshSend(); };
  ta.onkeydown = (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); } };
  $('#sendBtn').onclick = onSend;
  document.addEventListener('mouseup', onMouseUp);
  $('#thread').addEventListener('scroll', hidePopover);
  renderDocButton();
}

function toggleTheme() {
  state.theme = state.theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem('atlas-rag-theme', state.theme);
  document.documentElement.classList.toggle('dark', state.theme === 'dark');
  $('#themeBtn').innerHTML = state.theme === 'dark' ? ICON.sun : ICON.moon;
}

// ---------- document selector ----------
function currentDoc() { return state.docs.find(d => d.id === state.docId) || state.docs[0]; }

function renderDocButton() {
  const d = currentDoc(); if (!d) return;
  $('#docBtn').innerHTML = `
    <span class="mono" style="width:22px;height:22px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;background:${d.color};">${esc(d.tag)}</span>
    <span style="display:flex;flex-direction:column;align-items:flex-start;line-height:1;flex:1;min-width:0;">
      <span class="mono" style="font-size:12.5px;font-weight:500;color:var(--text-strong);max-width:170px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(d.name)}</span>
      <span style="font-size:10.5px;color:var(--muted);margin-top:3px;">${esc(d.meta||'')}</span>
    </span>
    <span style="color:var(--muted);display:flex;">${ICON.chevron}</span>`;
}

function docRowHtml(d) {
  return `
    <button data-doc="${esc(d.id)}" class="docRow" style="width:100%;display:flex;align-items:center;gap:11px;padding:9px;background:${d.id===state.docId?'var(--hover)':'transparent'};border:none;border-radius:8px;cursor:pointer;text-align:left;">
      <span class="mono" style="width:24px;height:24px;flex:0 0 24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600;color:#fff;background:${d.color};">${esc(d.tag)}</span>
      <span style="flex:1;min-width:0;display:flex;flex-direction:column;line-height:1;">
        <span class="mono" style="font-size:12.5px;color:var(--text-strong);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(d.name)}</span>
        <span style="font-size:10.5px;color:var(--muted);margin-top:3px;">${esc(d.meta||'')}</span>
      </span>
      ${d.id===state.docId ? `<span style="color:var(--accent);display:flex;">${ICON.check}</span>` : ''}
    </button>`;
}

// Only the ROW list re-renders as the user types -- the <input> element is left untouched, so the
// caret/selection are preserved (rebuilding the input each keystroke is what caused select-all-on-type).
function renderDocRows() {
  const host = $('#docRows'); if (!host) return;
  const q = state.docQuery.trim().toLowerCase();
  const list = state.docs.filter(d => !q || d.name.toLowerCase().includes(q));
  host.innerHTML = list.length
    ? list.map(docRowHtml).join('')
    : `<div class="mono" style="padding:16px 10px 18px;text-align:center;font-size:11.5px;color:var(--muted);">No documents match “${esc(state.docQuery)}”</div>`;
  host.querySelectorAll('.docRow').forEach(b => b.onclick = () => {
    state.docId = b.getAttribute('data-doc'); state.menuOpen = false; renderDocMenu(); renderDocButton();
  });
}

function renderDocMenu() {
  const host = $('#docMenu');
  if (!state.menuOpen) { host.innerHTML=''; return; }
  host.innerHTML = `
    <div style="position:absolute;top:46px;left:0;width:296px;background:var(--surface-2);border:1px solid var(--border-2);border-radius:12px;box-shadow:0 12px 34px rgba(40,36,28,.16);padding:6px;z-index:50;">
      <div style="display:flex;align-items:center;gap:8px;height:36px;padding:0 10px;margin:2px 2px 6px;background:var(--surface-3);border:1px solid var(--border-2);border-radius:8px;">
        <span style="color:var(--muted);display:flex;flex:0 0 14px;">${ICON.search}</span>
        <input id="docSearch" class="mono" placeholder="Search documents by name…" value="${esc(state.docQuery)}" style="flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:12px;color:var(--text);padding:0;">
      </div>
      <div class="mono" style="font-size:9.5px;letter-spacing:1px;text-transform:uppercase;color:var(--muted-2);padding:3px 9px 8px;">Retrieve from</div>
      <div id="docRows" style="max-height:44vh;overflow-y:auto;overflow-x:hidden;"></div>
    </div>
    <div id="docScrim" style="position:fixed;inset:0;z-index:45;"></div>`;
  $('#docSearch').oninput = (e) => { state.docQuery = e.target.value; renderDocRows(); };
  $('#docScrim').onclick = () => { state.menuOpen=false; renderDocMenu(); };
  renderDocRows();
}

async function loadDocs() {
  try {
    const r = await fetch(API + '/api/docs'); const j = await r.json();
    state.docs = (j.documents || []).map(d => ({
      id: d.id, name: d.name, meta: d.meta, kind: d.kind,
      tag: tagFor(d.kind === 'all' ? 'all' : 'pdf'),
      color: d.kind === 'all' ? '#6B675E' : colorFor(d.name),
    }));
    state.docs.forEach(d => { const m = String(d.meta||'').match(/\d+/); if (d.kind !== 'all' && m) state.pageCounts[d.name] = +m[0]; });
    const n = state.docs.filter(d => d.kind !== 'all').length;
    $('#statusText').textContent = `Indexed locally · ${n} source${n===1?'':'s'}`;
    renderDocButton();
  } catch (e) { $('#statusText').textContent = 'API unavailable'; }
}

// ---------- thread (append-only DOM; tokens stream into a text node, no re-render) ----------
function refreshSend() {
  const has = $('#composer').value.trim().length > 0 && !state.busy;
  $('#sendBtn').style.background = has ? 'var(--accent)' : 'var(--disabled)';
}

// render the finalized answer text with inline citation chips
// --- lightweight markdown (bold/italic/code + bullet lists), enough for the LLM's and the
// compute path's output. No external renderer (air-gap); [S#] become placeholders wired below.
// The LLM sometimes writes inline LaTeX (e.g. "\( n_d \)"). We have no math engine (air-gap), so
// convert the common constructs to readable HTML: subscripts/superscripts -> <sub>/<sup>, \frac -> a/b,
// greek + operators -> unicode. Runs ONLY inside math delimiters, so prose italics ("_word_") are safe.
const _GREEK = {'\\alpha':'α','\\beta':'β','\\gamma':'γ','\\delta':'δ','\\Delta':'Δ','\\epsilon':'ε',
  '\\theta':'θ','\\lambda':'λ','\\mu':'µ','\\nu':'ν','\\pi':'π','\\rho':'ρ','\\sigma':'σ','\\Sigma':'Σ',
  '\\tau':'τ','\\phi':'φ','\\omega':'ω','\\Omega':'Ω','\\times':'×','\\cdot':'·','\\div':'÷','\\pm':'±',
  '\\leq':'≤','\\geq':'≥','\\neq':'≠','\\approx':'≈','\\infty':'∞','\\sum':'Σ','\\int':'∫',
  '\\partial':'∂','\\rightarrow':'→','\\to':'→','\\ldots':'…','\\cdots':'⋯','\\,':' ','\\;':' '};
function renderMath(x) {
  let s = x.trim();
  s = s.replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '($1)/($2)');
  s = s.replace(/\\sqrt\s*\{([^{}]*)\}/g, '√($1)');
  s = s.replace(/\\text\s*\{([^{}]*)\}/g, '$1');
  for (const k in _GREEK) s = s.split(k).join(_GREEK[k]);
  s = s.replace(/\^\{([^{}]*)\}/g, '<sup>$1</sup>').replace(/\^(\w)/g, '<sup>$1</sup>');
  s = s.replace(/_\{([^{}]*)\}/g, '<sub>$1</sub>').replace(/_(\w)/g, '<sub>$1</sub>');
  s = s.replace(/[{}]/g, '').replace(/\\([a-zA-Z]+)/g, '$1');   // strip leftover braces / unknown \cmds
  return '<span class="math">' + s + '</span>';
}
function mdInline(s) {
  return s
    .replace(/\\\((.+?)\\\)|\\\[(.+?)\\\]|\$\$(.+?)\$\$/g, (m, a, b, c) => renderMath(a || b || c))
    .replace(/`([^`]+)`/g, '<code class="md-code">$1</code>')
    .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^_])_([^_\n]+)_/g, '$1<em>$2</em>')
    .replace(/\[(S\d+)\]/g, (m, t) => `<sup class="cite-chip" data-tag="${t}"></sup>`);
}
function mdToHtml(text) {
  const lines = esc(text).split('\n');
  let html = '', inList = false, para = [];
  const flushPara = () => { if (para.length) { html += `<p style="margin:0 0 10px;">${para.join('<br>')}</p>`; para = []; } };
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };
  for (const raw of lines) {
    const line = raw.trim();
    const bullet = line.match(/^[-*]\s+(.*)/);
    if (bullet) { flushPara(); if (!inList) { html += '<ul style="margin:0 0 10px;padding-left:20px;">'; inList = true; } html += `<li style="margin:3px 0;">${mdInline(bullet[1])}</li>`; }
    else if (!line) { flushPara(); closeList(); }
    else { closeList(); para.push(mdInline(line)); }
  }
  flushPara(); closeList();
  return html;
}

function renderAnswer(answerEl, answer, tag_to_n, msgId) {
  answerEl.style.whiteSpace = 'normal';          // was pre-wrap for streaming; markdown supplies structure
  answerEl.innerHTML = mdToHtml(answer);
  answerEl.querySelectorAll('.cite-chip').forEach(sup => {
    const t = sup.getAttribute('data-tag'); const n = tag_to_n[t];
    if (n == null) { sup.replaceWith(document.createTextNode(`[${t}]`)); return; }  // never-provided tag stays visible
    sup.textContent = n;
    sup.style.cssText = "cursor:pointer;font-family:'IBM Plex Mono',monospace;font-size:10px;font-weight:600;color:#fff;background:var(--muted);border-radius:5px;padding:1px 5px;margin:0 1px;vertical-align:1px;line-height:1.6;transition:background .15s;";
    sup.onclick = () => openCite(msgId, n);
  });
}

// Plain-text version of an answer for the clipboard: drop citation tags + markdown markers.
function toPlain(a) {
  return String(a || '')
    .replace(/\[S\d+\]/g, '')
    .replace(/\\[()[\]]/g, '').replace(/\$\$/g, '')                 // math delimiters
    .replace(/\\frac\s*\{([^{}]*)\}\s*\{([^{}]*)\}/g, '($1)/($2)')
    .replace(/\\([a-zA-Z]+)/g, '$1').replace(/[{}]/g, '')           // \cmd -> cmd, drop braces
    .replace(/\*\*([^*]+)\*\*/g, '$1')
    .replace(/`([^`]+)`/g, '$1')
    .replace(/(^|[^_])_([^_\n]+)_/g, '$1$2')
    .replace(/[ \t]+\n/g, '\n')
    .replace(/[ \t]{2,}/g, ' ')
    .trim();
}

// A small copy button that flashes a tick on success. getText is called at click time.
function makeCopyBtn(getText) {
  const b = document.createElement('button');
  b.className = 'hov-soft';
  b.title = 'Copy';
  b.style.cssText = 'display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 8px;border:none;background:transparent;border-radius:7px;cursor:pointer;color:var(--faint);font-size:11.5px;transition:color .15s;';
  b.innerHTML = ICON.copy;
  b.onclick = async () => {
    const t = getText();
    try { await navigator.clipboard.writeText(t); }
    catch (_) { const ta = document.createElement('textarea'); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) {} ta.remove(); }
    b.innerHTML = `${ICON.tick}<span>Copied</span>`; b.style.color = 'var(--green)';
    setTimeout(() => { b.innerHTML = ICON.copy; b.style.color = 'var(--faint)'; }, 1400);
  };
  return b;
}

// ---------- ask / SSE ----------
async function onSend() {
  const ta = $('#composer'); const q = ta.value.trim();
  if (!q || state.busy) return;
  const quote = state.quote;
  const question = quote ? `Regarding this passage: "${quote}"\n\n${q}` : q;
  appendUser(q, quote);
  ta.value=''; ta.style.height='auto'; state.quote=''; renderQuoteChip();
  state.busy = true; refreshSend();
  showLoader();

  let refs = null, raw = '', tokenStarted = false;
  try {
    const resp = await fetch(API + '/api/ask', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ question, doc: state.docId }),
    });
    const reader = resp.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream: true });
      const frames = buf.split('\n\n'); buf = frames.pop();
      for (const f of frames) {
        let ev = 'message', data = '';
        for (const line of f.split('\n')) {
          if (line.startsWith('event:')) ev = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).trim();
        }
        if (!data) continue;
        let p; try { p = JSON.parse(data); } catch (_) { continue; }
        if (ev === 'stage') { setStage(p.stage === 'retrieving' ? 1 : 2); }
        else if (ev === 'token') {
          if (!tokenStarted) { tokenStarted = true; removeLoader(); refs = appendAssistantShell(); }
          raw += p.text;
          refs.answerEl.textContent = raw.replace(/\[S\d+\]/g, '').replace(/\[S?\d*$/, '');
          scrollThread();
        }
        else if (ev === 'done') {
          if (!refs) { removeLoader(); refs = appendAssistantShell(); }
          finalizeAssistant(refs, p, raw);
        }
      }
    }
  } catch (e) {
    removeLoader();
    if (!refs) refs = appendAssistantShell();
    refs.answerEl.textContent = 'Could not reach the local API. Is the server running on :8000?';
  } finally {
    state.busy = false; refreshSend();
  }
}

function finalizeAssistant(refs, payload, raw) {
  const answer = payload.answer || raw || '';
  const cites = payload.citations || [];
  const tag_to_n = payload.tag_to_n || {};
  renderAnswer(refs.answerEl, answer, tag_to_n, refs.id);
  state.msgs[refs.id] = { citations: cites, tag_to_n };

  refs.actionsEl.innerHTML = '';
  if (cites.length) {
    const btn = document.createElement('button');
    btn.setAttribute('data-srcbtn', refs.id);
    styleSrcBtn(btn, false, cites.length);
    btn.onclick = () => openSources(refs.id);
    refs.actionsEl.appendChild(btn);
  } else {
    const note = document.createElement('span');
    note.className = 'mono';
    note.style.cssText = 'font-size:11.5px;color:var(--muted);display:inline-flex;align-items:center;gap:7px;';
    note.innerHTML = `${ICON.shield}${payload.compute ? 'Computed locally · no retrieval' : 'No sources cited'}`;
    refs.actionsEl.appendChild(note);
  }
  refs.actionsEl.appendChild(makeCopyBtn(() => toPlain(answer)));
  scrollThread();
  if (cites.length) openSources(refs.id);   // auto-open the panel like the design
}

function styleSrcBtn(btn, active, count) {

          <span style="width:8px;height:8px;border-radius:2px;background:var(--border-strong);"></span>
          <span class="mono" style="font-size:9.5px;letter-spacing:.5px;color:var(--muted);">${kindLabel}</span>
          <span style="flex:1;"></span>
          <span class="mono" style="font-size:9.5px;color:var(--muted);">${esc(v.loc||'')}</span>
          <span style="flex:0 0 auto;display:flex;align-items:center;gap:2px;margin-left:8px;">
            <button id="zOut" class="hov-soft" style="width:22px;height:22px;border:none;background:transparent;border-radius:5px;cursor:pointer;color:var(--text-3);font-size:15px;line-height:1;display:flex;align-items:center;justify-content:center;">−</button>
            <span id="zLbl" class="mono" style="font-size:9.5px;color:var(--muted);min-width:30px;text-align:center;">100%</span>
            <button id="zIn" class="hov-soft" style="width:22px;height:22px;border:none;background:transparent;border-radius:5px;cursor:pointer;color:var(--text-3);font-size:14px;line-height:1;display:flex;align-items:center;justify-content:center;">+</button>
          </span>
        </div>
        <div id="vp" style="overflow:hidden;background:var(--surface-3);cursor:grab;user-select:none;-webkit-user-select:none;">
          ${v.image_url ? `<img id="vpImg" src="${esc(v.image_url)}" alt="" style="display:block;width:100%;transform-origin:top left;transition:transform .08s ease-out;user-select:none;-webkit-user-drag:none;">` : `<div class="mono" style="padding:40px;text-align:center;color:var(--muted);">no image</div>`}
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;margin:16px 2px 0;">
        <span class="mono" style="font-size:10px;color:var(--muted);">match</span>
        ${matchBar(v.match)}
      </div>
      <button id="vBackBtn" class="hov-border" style="display:flex;align-items:center;justify-content:center;gap:7px;width:100%;height:38px;margin-top:14px;border-radius:9px;border:1px solid var(--border-2);background:var(--surface-2);cursor:pointer;font-size:12.5px;font-weight:500;color:var(--text-2);transition:border-color .15s,color .15s;">${ICON.back}Back to all sources</button>
    </div>`;
  $('#vBackBtn').onclick = backToList;
  wireZoom();
}

function wireZoom() {
  const vp = $('#vp'), img = $('#vpImg'); if (!img) return;
  const lbl = $('#zLbl');
  const clampPan = () => {                       // keep the image edges from drifting inside the viewport
    const r = vp.getBoundingClientRect();
    const w = img.clientWidth * state.zoom, h = img.clientHeight * state.zoom;
    state.tx = Math.max(Math.min(0, r.width - w), Math.min(0, state.tx));
    state.ty = Math.max(Math.min(0, r.height - h), Math.min(0, state.ty));
  };
  const apply = () => { img.style.transform = `translate(${state.tx}px,${state.ty}px) scale(${state.zoom})`; if (lbl) lbl.textContent = Math.round(state.zoom*100)+'%'; };
  // Zoom toward the point (px,py) in viewport coords so it stays put -- not the top-left corner.
  const zoomTo = (z1, px, py) => {
    z1 = Math.max(1, Math.min(5, z1));
    const z0 = state.zoom; if (z1 === z0) return;
    const r = vp.getBoundingClientRect();
    const cx = px == null ? r.width / 2 : px - r.left;
    const cy = py == null ? r.height / 2 : py - r.top;
    state.tx = cx - (cx - state.tx) * (z1 / z0);
    state.ty = cy - (cy - state.ty) * (z1 / z0);
    state.zoom = z1;
    if (state.zoom === 1) { state.tx = 0; state.ty = 0; } else { clampPan(); }
    apply();
  };
  $('#zIn').onclick = () => zoomTo(state.zoom + 0.5);
  $('#zOut').onclick = () => zoomTo(state.zoom - 0.5);
  // Trackpad pinch arrives as a wheel event with ctrlKey set; zoom GENTLY and proportionally to the
  // gesture size. Plain two-finger scroll (no ctrlKey) is left alone so it scrolls the panel.
  vp.onwheel = (e) => {
    if (!e.ctrlKey) return;
    e.preventDefault();
    zoomTo(state.zoom * Math.exp(-e.deltaY * 0.0024), e.clientX, e.clientY);
  };
  // Drag-to-pan only when zoomed in. preventDefault stops text selection; listeners are added per
  // drag and removed on release, so repeated opens don't leak handlers.
  vp.onmousedown = (e) => {
    if (state.zoom === 1) return;
    e.preventDefault();
    const sx = e.clientX - state.tx, sy = e.clientY - state.ty;
    vp.style.cursor = 'grabbing';
    const move = (ev) => { state.tx = ev.clientX - sx; state.ty = ev.clientY - sy; clampPan(); apply(); };
    const up = () => { document.removeEventListener('mousemove', move); document.removeEventListener('mouseup', up); vp.style.cursor = 'grab'; };
    document.addEventListener('mousemove', move);
    document.addEventListener('mouseup', up);
  };
  apply();
}

// ---------- select-to-follow-up ----------
function onMouseUp(e) {
  // A click on the popover must NOT re-run this handler -- doing so rebuilt #popover and destroyed
  // the element mid-click, so the "Ask about this" click never fired. Let its own onclick run.
  if (e && e.target && e.target.closest && e.target.closest('#popover')) return;
  const sel = window.getSelection && window.getSelection();
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed) return hidePopover();
  const text = sel.toString().replace(/\s+/g, ' ').trim();
  if (text.length < 2) return hidePopover();
  let node = sel.anchorNode; let el = node && node.nodeType === 3 ? node.parentElement : node;
  const ans = el && el.closest ? el.closest('[data-answer]') : null;
  if (!ans) return hidePopover();
  const r = sel.getRangeAt(0).getBoundingClientRect();
  if (!r || (!r.width && !r.height)) return hidePopover();
  state.sel = { visible: true, x: r.left + r.width/2, y: r.top, text };
  renderPopover();
}
function renderPopover() {
  const host = $('#popover'); const s = state.sel;
  if (!s.visible) { host.innerHTML=''; return; }
  host.innerHTML = `<div style="position:fixed;left:${s.x}px;top:${s.y}px;transform:translate(-50%,calc(-100% - 9px));z-index:80;background:var(--tooltip-bg);border:1px solid var(--border-2);border-radius:10px;padding:8px 13px;box-shadow:0 10px 28px rgba(0,0,0,.26);display:flex;align-items:center;white-space:nowrap;animation:atlPop .14s ease both;cursor:pointer;color:var(--tooltip-text);">
    <span style="display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:500;">${ICON.quote}Ask about this</span></div>`;
  const pop = host.firstElementChild;
  pop.onmousedown = (e) => { e.preventDefault(); e.stopPropagation(); };
  pop.onclick = () => { state.quote = s.text; hidePopover(); try { window.getSelection().removeAllRanges(); } catch(_){}; renderQuoteChip(); $('#composer').focus(); };
}
function hidePopover() { if (state.sel.visible) { state.sel = { visible:false, x:0, y:0, text:'' }; renderPopover(); } }

function renderQuoteChip() {
  const host = $('#quoteChip');
  if (!state.quote) { host.innerHTML=''; return; }
  host.innerHTML = `<div style="display:flex;gap:9px;align-items:flex-start;margin:2px 2px 6px;padding:9px 11px;background:var(--surface-3);border:1px solid var(--border-2);border-left:3px solid var(--accent);border-radius:9px;">
    <span style="color:var(--accent);flex:0 0 14px;margin-top:2px;display:flex;">${ICON.quote}</span>
    <span class="serif" style="flex:1;min-width:0;font-style:italic;font-size:12.5px;line-height:1.5;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;">${esc(state.quote)}</span>
    <button id="quoteClear" class="hov-soft" style="width:20px;height:20px;flex:0 0 20px;border:none;background:transparent;border-radius:5px;cursor:pointer;color:var(--muted);display:flex;align-items:center;justify-content:center;">${ICON.close}</button></div>`;
  $('#quoteClear').onclick = () => { state.quote=''; renderQuoteChip(); };
}

// ---------- boot ----------
buildShell();
loadDocs();
</script>
