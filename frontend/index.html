<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas · Local Multimodal RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: #F6F4EF; color: #1A1A18; -webkit-font-smoothing: antialiased; }
  textarea { font-family: inherit; }
  button { font-family: inherit; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #DAD6CC; border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #C7C2B5; background-clip: content-box; }
  @keyframes atlSpin { to { transform: rotate(360deg); } }
  @keyframes atlFadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes atlPulseDot { 0%, 100% { opacity: .25; transform: scale(.8); } 50% { opacity: 1; transform: scale(1); } }
  @keyframes atlBar { 0% { left: -35%; } 100% { left: 100%; } }
  .atl-hover-row:hover { background: #F4F2EC !important; }
  .atl-menu-btn:hover { border-color: #C9C2B4 !important; }
  .atl-icon-btn:hover { background: #F0EEE7 !important; color: #6B675E !important; }
  .atl-cite-chip { cursor: pointer; font-family: 'IBM Plex Mono'; font-size: 10px; font-weight: 600; color: #FFFFFF; background: #9A958A; border-radius: 5px; padding: 1px 5px; margin: 0 1px; vertical-align: 1px; line-height: 1.6; }
  .atl-cite-chip:hover { background: #2F5BEA; }
  .atl-open-btn:hover { border-color: #2F5BEA !important; color: #2F5BEA !important; }
</style>
</head>
<body>
<div style="height: 100vh; display: flex; flex-direction: column; overflow: hidden;">

  <!-- HEADER -->
  <header style="height: 60px; flex: 0 0 60px; display: flex; align-items: center; gap: 18px; padding: 0 22px; background: #FBFAF7; border-bottom: 1px solid #E7E3DA; position: relative; z-index: 40;">
    <div style="display: flex; align-items: center; gap: 11px;">
      <div style="width: 30px; height: 30px; border-radius: 8px; background: #1A1A18; color: #F6F4EF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 5px rgba(0,0,0,.18);">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 3.2C2 2.5 2.5 2 3.2 2H7v12H3.2C2.5 14 2 13.5 2 12.8V3.2Z" stroke="currentColor" stroke-width="1.3"/><path d="M14 3.2C14 2.5 13.5 2 12.8 2H9v12h3.8c.7 0 1.2-.5 1.2-1.2V3.2Z" stroke="currentColor" stroke-width="1.3"/></svg>
      </div>
      <div style="display: flex; flex-direction: column; line-height: 1;">
        <span style="font-size: 15px; font-weight: 600; letter-spacing: -.2px;">Atlas</span>
        <span style="font-family: 'IBM Plex Mono', monospace; font-size: 9.5px; letter-spacing: 1.2px; color: #9A958A; text-transform: uppercase; margin-top: 3px;">Local Multimodal RAG</span>
      </div>
    </div>

    <div style="width: 1px; height: 26px; background: #E7E3DA;"></div>

    <!-- Document selector -->
    <div style="position: relative;">
      <button id="docBtn" class="atl-menu-btn" style="display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 12px 0 11px; background: #FFFFFF; border: 1px solid #E2DDD2; border-radius: 9px; cursor: pointer; min-width: 248px;">
        <span id="docTag" style="width: 22px; height: 22px; border-radius: 5px; display: flex; align-items: center; justify-content: center; font-family: 'IBM Plex Mono'; font-size: 11px; font-weight: 600; color: #FFFFFF; background: #6B675E;">∗</span>
        <span style="display: flex; flex-direction: column; align-items: flex-start; line-height: 1; flex: 1;">
          <span id="docName" style="font-family: 'IBM Plex Mono'; font-size: 12.5px; font-weight: 500; color: #2A2823;">All documents</span>
          <span id="docMeta" style="font-size: 10.5px; color: #9A958A; margin-top: 3px;">—</span>
        </span>
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" style="color: #9A958A;"><path d="M4 6.5L8 10.5L12 6.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="docMenu" style="display: none; position: absolute; top: 46px; left: 0; width: 320px; max-height: 60vh; overflow-y: auto; background: #FFFFFF; border: 1px solid #E2DDD2; border-radius: 12px; box-shadow: 0 12px 34px rgba(40,36,28,.16); padding: 6px; z-index: 50;">
        <div style="font-family: 'IBM Plex Mono'; font-size: 9.5px; letter-spacing: 1px; text-transform: uppercase; color: #ADA89C; padding: 7px 9px 8px;">Retrieve from</div>
        <div id="docList"></div>
      </div>
    </div>

    <div style="flex: 1;"></div>

    <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 13px; background: #F0EFE9; border: 1px solid #E7E3DA; border-radius: 20px;">
      <span style="width: 7px; height: 7px; border-radius: 50%; background: #2FA866; box-shadow: 0 0 0 3px rgba(47,168,102,.16);"></span>
      <span id="statusPill" style="font-family: 'IBM Plex Mono'; font-size: 11px; color: #6B675E;">Indexed locally</span>
    </div>
  </header>

  <!-- BODY -->
  <div style="flex: 1; display: flex; min-height: 0;">

    <!-- Chat column -->
    <div style="flex: 1; display: flex; flex-direction: column; min-width: 0;">
      <div id="thread" style="flex: 1; overflow-y: auto; padding: 30px 0 18px;">
        <div id="threadInner" style="max-width: 720px; margin: 0 auto; padding: 0 30px; display: flex; flex-direction: column; gap: 26px;"></div>
      </div>

      <!-- Composer -->
      <div style="flex: 0 0 auto; padding: 6px 30px 22px; background: linear-gradient(to top, #F6F4EF 62%, rgba(246,244,239,0));">
        <div style="max-width: 720px; margin: 0 auto;">
          <div style="background: #FFFFFF; border: 1px solid #E2DDD2; border-radius: 16px; box-shadow: 0 6px 22px rgba(40,36,28,.07); padding: 6px;">
            <div style="display: flex; align-items: flex-end; gap: 8px;">
              <textarea id="input" rows="1" placeholder="Ask anything about your documents…" style="flex: 1; resize: none; border: none; outline: none; background: transparent; font-size: 14.5px; line-height: 1.5; color: #26241F; padding: 9px 4px 9px 12px; max-height: 140px;"></textarea>
              <button id="sendBtn" style="width: 38px; height: 38px; flex: 0 0 38px; border: none; border-radius: 11px; cursor: pointer; background: #CFCABE; color: #FFFFFF; display: flex; align-items: center; justify-content: center; transition: background .15s;">
                <svg width="17" height="17" viewBox="0 0 17 17" fill="none"><path d="M8.5 14V3.5M8.5 3.5L4 8M8.5 3.5L13 8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
            </div>
          </div>
          <div style="display: flex; align-items: center; justify-content: center; gap: 7px; margin-top: 11px;">
            <svg width="12" height="12" viewBox="0 0 16 16" fill="none" style="color: #B0AB9F;"><path d="M7 1.5l5 2.5v3.5c0 3-2.2 5.3-5 6-2.8-.7-5-3-5-6V4L7 1.5Z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>
            <span style="font-family: 'IBM Plex Mono'; font-size: 10.5px; color: #ADA89C;">Answers cite their sources · running fully on-device</span>
          </div>
        </div>
      </div>
    </div>

    <!-- CITATION PANEL -->
    <div id="panelWrap" style="flex: 0 0 auto; height: 100%; overflow: hidden; transition: width .34s cubic-bezier(.4,0,.2,1); width: 416px;">
      <div style="width: 416px; height: 100%; display: flex; flex-direction: column; background: #FBFAF7; border-left: 1px solid #E7E3DA;">
        <div style="flex: 0 0 auto; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 20px; border-bottom: 1px solid #E7E3DA;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="color: #2F5BEA;"><path d="M3 2.5h7l3 3V13a.5.5 0 0 1-.5.5h-9A.5.5 0 0 1 3 13V2.5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M9.5 2.5V6h3.5" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          <span style="font-size: 14px; font-weight: 600; letter-spacing: -.1px;">Cited sources</span>
          <span id="citeCount" style="font-family: 'IBM Plex Mono'; font-size: 11px; color: #FFFFFF; background: #2F5BEA; border-radius: 11px; padding: 2px 8px;">0</span>
          <div style="flex: 1;"></div>
          <button id="panelClose" class="atl-icon-btn" style="width: 30px; height: 30px; border: none; background: transparent; border-radius: 8px; cursor: pointer; color: #9A958A; display: flex; align-items: center; justify-content: center;">
            <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
        <div id="panel" style="flex: 1; overflow-y: auto; padding: 16px 16px 22px;">
          <div style="font-family: 'IBM Plex Mono'; font-size: 10px; letter-spacing: .8px; text-transform: uppercase; color: #ADA89C; padding: 2px 4px 12px;">Passages grounding this answer</div>
          <div id="citeList" style="display: flex; flex-direction: column; gap: 13px;"></div>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const API = '';   // same origin (served by FastAPI)
const DOC_COLORS = ['#D4483B', '#E0892B', '#2E9E8F', '#2F5BEA', '#7A5BD4', '#C7384F'];
const state = { docs: [], selected: 'all', panelOpen: true, busy: false, msgs: [], activeCites: [] };
const el = id => document.getElementById(id);
const esc = s => (s || '').replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

// ---- document selector -------------------------------------------------------
async function loadDocs() {
  try {
    const r = await fetch(API + '/api/docs');
    const d = await r.json();
    state.docs = d.documents;
    el('statusPill').textContent = 'Indexed locally · ' + (state.docs.length - 1) + ' sources';
    renderDocMenu();
    selectDoc('all');
  } catch (e) { el('statusPill').textContent = 'Backend offline'; }
}
function docColor(doc) {
  if (doc.id === 'all') return '#6B675E';
  let h = 0; for (const c of doc.id) h = (h * 31 + c.charCodeAt(0)) >>> 0;
  return DOC_COLORS[h % DOC_COLORS.length];
}
function docTag(doc) { return doc.id === 'all' ? '∗' : (doc.name[0] || 'P').toUpperCase(); }
function renderDocMenu() {
  el('docList').innerHTML = '';
  for (const doc of state.docs) {
    const b = document.createElement('button');
    b.className = 'atl-hover-row';
    b.style.cssText = 'width:100%;display:flex;align-items:center;gap:11px;padding:9px;background:transparent;border:none;border-radius:8px;cursor:pointer;text-align:left;';
    b.innerHTML =
      `<span style="width:24px;height:24px;flex:0 0 24px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:11px;font-weight:600;color:#FFF;background:${docColor(doc)};">${docTag(doc)}</span>`
    + `<span style="flex:1;display:flex;flex-direction:column;line-height:1;min-width:0;"><span style="font-family:'IBM Plex Mono';font-size:12.5px;color:#2A2823;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(doc.name)}</span><span style="font-size:10.5px;color:#9A958A;margin-top:3px;">${esc(doc.meta || '')}</span></span>`
    + (doc.id === state.selected ? `<svg width="15" height="15" viewBox="0 0 16 16" fill="none" style="color:#2F5BEA;"><path d="M3 8.5L6.2 11.5L13 4.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>` : '');
    b.onclick = () => { selectDoc(doc.id); toggleMenu(false); };
    el('docList').appendChild(b);
  }
}
function selectDoc(id) {
  state.selected = id;
  const doc = state.docs.find(d => d.id === id) || { id: 'all', name: 'All documents', meta: '' };
  el('docTag').textContent = docTag(doc); el('docTag').style.background = docColor(doc);
  el('docName').textContent = doc.name; el('docMeta').textContent = doc.meta || '';
  renderDocMenu();
}
function toggleMenu(force) {
  const open = force !== undefined ? force : el('docMenu').style.display === 'none';
  el('docMenu').style.display = open ? 'block' : 'none';
}
el('docBtn').onclick = e => { e.stopPropagation(); toggleMenu(); };
document.addEventListener('click', () => toggleMenu(false));

// ---- chat thread -------------------------------------------------------------
function renderThread() {
  const inner = el('threadInner'); inner.innerHTML = '';
  for (const m of state.msgs) inner.appendChild(m.role === 'user' ? userEl(m) : asstEl(m));
  if (state.busy) inner.appendChild(loaderEl());
  el('thread').scrollTop = el('thread').scrollHeight;
}
function userEl(m) {
  const d = document.createElement('div');
  d.style.cssText = 'display:flex;justify-content:flex-end;animation:atlFadeUp .35s ease both;';
  d.innerHTML = `<div style="max-width:80%;background:#1A1A18;color:#F4F2EC;padding:11px 15px;border-radius:14px 14px 4px 14px;font-size:14.5px;line-height:1.5;">${esc(m.text)}</div>`;
  return d;
}
function answerHtml(m) {
  // replace [S#] inline markers with numbered, clickable citation chips
  let html = esc(m.text);
  html = html.replace(/\[(S\d+)\]/g, (full, tag) => {
    const n = m.tag_to_n && m.tag_to_n[tag];
    return n ? `<sup class="atl-cite-chip" data-n="${n}">${n}</sup>` : '';
  });
  return html;
}
function asstEl(m) {
  const d = document.createElement('div');
  d.style.cssText = 'animation:atlFadeUp .4s ease both;';
  const cnt = (m.citations || []).length;
  const showing = m.id === state.activeMsg && state.panelOpen;
  const srcBtn = cnt ? `<button class="atl-src-btn" data-mid="${m.id}" style="display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px;border-radius:8px;cursor:pointer;font-size:12.5px;font-weight:500;background:${showing ? '#2F5BEA' : '#FFFFFF'};color:${showing ? '#FFFFFF' : '#4A463E'};border:1px solid ${showing ? '#2F5BEA' : '#E2DDD2'};"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><rect x="2.5" y="2" width="11" height="12" rx="1.5" stroke="currentColor" stroke-width="1.3"/><path d="M5 5.5h6M5 8h6M5 10.5h3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>${showing ? 'Showing ' : 'View '}${cnt} source${cnt > 1 ? 's' : ''}</button>` : '';
  d.innerHTML =
    `<div style="display:flex;align-items:center;gap:9px;margin-bottom:11px;"><span style="width:24px;height:24px;border-radius:7px;background:#1A1A18;color:#F6F4EF;display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 16 16" fill="none"><path d="M2 3.2C2 2.5 2.5 2 3.2 2H7v12H3.2C2.5 14 2 13.5 2 12.8V3.2Z" stroke="currentColor" stroke-width="1.3"/><path d="M14 3.2C14 2.5 13.5 2 12.8 2H9v12h3.8c.7 0 1.2-.5 1.2-1.2V3.2Z" stroke="currentColor" stroke-width="1.3"/></svg></span><span style="font-family:'IBM Plex Mono';font-size:11px;letter-spacing:.3px;color:#9A958A;">Atlas</span></div>`
  + `<div style="font-family:'IBM Plex Serif',serif;font-size:16px;line-height:1.72;color:#26241F;padding-left:33px;white-space:pre-wrap;">${answerHtml(m)}</div>`
  + (srcBtn ? `<div style="display:flex;align-items:center;gap:14px;margin-top:16px;padding-left:33px;">${srcBtn}</div>` : '');
  d.querySelectorAll('.atl-cite-chip').forEach(c => c.onclick = () => openCite(m, +c.dataset.n));
  const sb = d.querySelector('.atl-src-btn');
  if (sb) sb.onclick = () => showSources(m);
  return d;
}
function loaderEl() {
  const stages = ['Searching across documents', 'Retrieving relevant pages', 'Synthesizing grounded answer'];
  const cur = state.stage || 0;
  const rows = stages.map((label, i) => {
    const done = i < cur, active = i === cur;
    const ic = done ? `<svg width="18" height="18" viewBox="0 0 18 18" fill="none"><circle cx="9" cy="9" r="8" fill="#2FA866"/><path d="M5.5 9.2L8 11.5L12.5 6.5" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`
      : active ? `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="animation:atlSpin 1s linear infinite;"><circle cx="8" cy="8" r="6.4" stroke="#E2DDD2" stroke-width="1.6"/><path d="M8 1.6A6.4 6.4 0 0 1 14.4 8" stroke="#2F5BEA" stroke-width="1.6" stroke-linecap="round"/></svg>`
      : `<span style="width:9px;height:9px;border-radius:50%;border:1.6px solid #DDD8CC;display:inline-block;"></span>`;
    return `<div style="display:flex;align-items:center;gap:11px;padding:5px 0;"><span style="width:18px;height:18px;flex:0 0 18px;display:flex;align-items:center;justify-content:center;">${ic}</span><span style="font-size:13px;font-weight:500;color:${i <= cur ? '#26241F' : '#ADA89C'};">${label}</span></div>`;
  }).join('');
  const d = document.createElement('div');
  d.style.cssText = 'animation:atlFadeUp .35s ease both;';
  d.innerHTML =
    `<div style="display:flex;align-items:center;gap:9px;margin-bottom:13px;"><span style="width:24px;height:24px;border-radius:7px;background:#1A1A18;color:#F6F4EF;display:flex;align-items:center;justify-content:center;"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" style="animation:atlSpin 1.1s linear infinite;"><path d="M8 1.6V4M8 12v2.4M3.5 3.5l1.7 1.7M10.8 10.8l1.7 1.7M1.6 8H4M12 8h2.4M3.5 12.5l1.7-1.7M10.8 5.2l1.7-1.7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span><span style="font-family:'IBM Plex Mono';font-size:11px;color:#9A958A;">Atlas is retrieving…</span></div>`
  + `<div style="margin-left:33px;background:#FFFFFF;border:1px solid #E7E3DA;border-radius:13px;padding:16px 18px;max-width:380px;box-shadow:0 4px 16px rgba(40,36,28,.05);">${rows}<div style="position:relative;height:3px;border-radius:3px;background:#EFEDE6;overflow:hidden;margin-top:12px;"><span style="position:absolute;top:0;width:35%;height:100%;border-radius:3px;background:#2F5BEA;animation:atlBar 1.15s ease-in-out infinite;"></span></div></div>`;
  return d;
}

// ---- citation panel ----------------------------------------------------------
function renderPanel() {
  el('panelWrap').style.width = state.panelOpen ? '416px' : '0px';
  const cites = state.activeCites || [];
  el('citeCount').textContent = cites.length;
  const list = el('citeList'); list.innerHTML = '';
  cites.forEach(c => {
    const active = c.n === state.activeRef;
    const card = document.createElement('div');
    card.id = 'cite-' + c.n;
    card.style.cssText = `scroll-margin-top:60px;background:#FFFFFF;border-radius:11px;padding:13px;transition:border-color .2s,box-shadow .2s;border:1px solid ${active ? '#2F5BEA' : '#EBE7DE'};box-shadow:${active ? '0 0 0 3px rgba(47,91,234,.13)' : '0 1px 2px rgba(40,36,28,.03)'};`;
    const tag = (c.doc || 'P')[0].toUpperCase();
    const color = docColor({ id: c.doc || '' });
    const kindLabel = c.kind === 'figure' ? 'FIGURE' : c.kind === 'table' ? 'TABLE' : 'PDF PAGE';
    const thumb = c.image_url
      ? `<img src="${API + c.image_url}" loading="lazy" style="width:100%;height:150px;object-fit:cover;object-position:top;display:block;background:#FFF;">`
      : `<div style="height:118px;background:#F4F2EC;"></div>`;
    card.innerHTML =
      `<div style="display:flex;align-items:center;gap:9px;margin-bottom:11px;"><span style="width:21px;height:21px;flex:0 0 21px;border-radius:6px;background:#2F5BEA;color:#FFF;font-family:'IBM Plex Mono';font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;">${c.n}</span><span style="width:19px;height:19px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-family:'IBM Plex Mono';font-size:9.5px;font-weight:600;color:#FFF;background:${color};">${tag}</span><span style="flex:1;min-width:0;font-family:'IBM Plex Mono';font-size:11.5px;color:#4A463E;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${esc(c.doc || '')}</span><span style="font-family:'IBM Plex Mono';font-size:10.5px;color:#9A958A;flex:0 0 auto;">${esc(c.loc || '')}</span></div>`
    + `<div style="position:relative;border-radius:8px;overflow:hidden;border:1px solid #EBE7DE;margin-bottom:11px;">${thumb}<span style="position:absolute;top:7px;right:8px;font-family:'IBM Plex Mono';font-size:9px;letter-spacing:.5px;color:#FFF;background:rgba(26,26,24,.6);border-radius:4px;padding:2px 6px;">${kindLabel}</span></div>`
    + `<p style="margin:0 0 11px;font-size:12.5px;line-height:1.62;color:#56524A;">${esc(c.snippet || '')}</p>`
    + `<div style="display:flex;align-items:center;justify-content:flex-end;"><a href="${API + (c.image_url || '#')}" target="_blank" class="atl-open-btn" style="display:inline-flex;align-items:center;gap:5px;height:25px;padding:0 9px;border-radius:7px;border:1px solid #E2DDD2;background:#FFF;cursor:pointer;text-decoration:none;font-size:11px;color:#4A463E;">Open<svg width="11" height="11" viewBox="0 0 12 12" fill="none"><path d="M3 9L9 3M9 3H4.5M9 3v4.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></a></div>`;
    list.appendChild(card);
  });
}
function showSources(m) {
  state.activeMsg = m.id; state.activeCites = m.citations || []; state.activeRef = null; state.panelOpen = true;
  renderThread(); renderPanel(); el('panel').scrollTo({ top: 0, behavior: 'smooth' });
}
function openCite(m, n) {
  state.activeMsg = m.id; state.activeCites = m.citations || []; state.activeRef = n; state.panelOpen = true;
  renderThread(); renderPanel();
  const card = el('cite-' + n);
  if (card) el('panel').scrollTo({ top: Math.max(0, card.offsetTop - 60), behavior: 'smooth' });
}
el('panelClose').onclick = () => { state.panelOpen = false; renderThread(); renderPanel(); };

// ---- send + SSE stream -------------------------------------------------------
function setSendEnabled(on) {
  el('sendBtn').style.background = on ? '#2F5BEA' : '#CFCABE';
}
el('input').addEventListener('input', () => { setSendEnabled(el('input').value.trim() && !state.busy); autoGrow(); });
function autoGrow() { const t = el('input'); t.style.height = 'auto'; t.style.height = Math.min(t.scrollHeight, 140) + 'px'; }
el('input').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
el('sendBtn').onclick = send;

async function send() {
  const q = el('input').value.trim();
  if (!q || state.busy) return;
  state.msgs.push({ role: 'user', text: q });
  el('input').value = ''; autoGrow(); setSendEnabled(false);
  state.busy = true; state.stage = 0;
  renderThread();

  const asst = { role: 'assistant', id: 'm' + Date.now(), text: '', citations: [], tag_to_n: {} };
  let started = false;
  try {
    const res = await fetch(API + '/api/ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question: q, doc: state.selected })
    });
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += dec.decode(value, { stream: true });
      let i;
      while ((i = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, i); buf = buf.slice(i + 2);
        let ev = 'message', data = '';
        for (const line of frame.split('\n')) {
          if (line.startsWith('event:')) ev = line.slice(6).trim();
          else if (line.startsWith('data:')) data += line.slice(5).replace(/^ /, '');
        }
        if (!data) continue;
        const p = JSON.parse(data);
        if (ev === 'stage') {
          state.stage = p.stage === 'retrieving' ? 1 : p.stage === 'generating' ? 2 : p.stage === 'computing' ? 2 : 0;
          renderThread();
        } else if (ev === 'token') {
          if (!started) { started = true; state.busy = false; state.msgs.push(asst); }
          asst.text += p.text; renderThread();
        } else if (ev === 'done') {
          asst.text = p.answer || asst.text; asst.citations = p.citations || []; asst.tag_to_n = p.tag_to_n || {};
          if (!started) { state.msgs.push(asst); }
          state.busy = false; state.activeMsg = asst.id; state.activeCites = asst.citations; state.activeRef = null;
          state.panelOpen = asst.citations.length > 0 || state.panelOpen;
          renderThread(); renderPanel();
        }
      }
    }
  } catch (e) {
    state.busy = false;
    if (!started) state.msgs.push({ role: 'assistant', id: 'err', text: '⚠ Could not reach the backend. Is api.py running on :8000?', citations: [], tag_to_n: {} });
    renderThread();
  }
  state.busy = false; renderThread();
}

loadDocs();
renderPanel();
</script>
